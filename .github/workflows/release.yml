# ==============================================================================
# Build, publish and deploy.
#
# On every push to main:
#   1. Build both images on GitHub's runners and push them to GHCR.
#   2. Deploy them from a runner inside your own network.
#
# The deploy job needs a self-hosted runner registered against this repository
# and labelled `lean-platform`. `scripts/setup-deployment.sh` walks through
# registering it. A runner without that label is never chosen, and deploys queue
# forever with nothing to say why.
#
# Nothing inbound is exposed: the runner polls GitHub outbound, so there is no
# SSH key here and no port open on the LXC.
# ==============================================================================

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Two overlapping deploys would race over the same
# containers and the same recorded tag, and the loser would roll back the
# winner. Not cancel-in-progress: a half-finished deploy should be allowed to
# finish or roll back, not be killed partway.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Publishing and deploying are gated on the same checks a pull request has to
  # pass. Without this, a red suite on main still ships to the LXC — the branch
  # protection that would otherwise catch it is not something this repository
  # can assume.
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            image: lean-platform-backend
          - name: frontend
            context: ./frontend
            image: lean-platform-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tag
        id: meta
        # An immutable tag derived from the commit, never ":latest". A floating
        # tag makes a rollout non-deterministic and makes rollback meaningless,
        # because the tag it rolls back to may now point at different content.
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # The LXC is x86_64. Stating the platform means an ARM runner would
          # still produce an image it can actually run, instead of one that
          # fails with "exec format error" after a deploy.
          platforms: linux/amd64
          # The registry path must be lowercase; GHCR rejects capitals. GitHub
          # normalises repository_owner to lowercase, so this always produces a
          # valid path — and moving the repository does not mean editing five
          # files to match.
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          # Scoped per image. Unscoped, the two matrix legs share one cache and
          # clobber each other's layers on every run.
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
          provenance: false

  deploy:
    name: Deploy to the LXC
    needs: build
    runs-on: [self-hosted, lean-platform]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GHCR_OWNER: ${{ github.repository_owner }}
          # The recorded tag lives outside the runner's workspace, which is
          # wiped between runs. Losing it would leave a deploy with nothing to
          # roll back to.
          STATE_FILE: /opt/lean-platform/.deployed-tag
        run: |
          mkdir -p /opt/lean-platform
          ./deploy/deploy.sh "${{ needs.build.outputs.tag }}"

      - name: Report what is serving
        if: always()
        run: |
          echo "deployed tag: $(cat /opt/lean-platform/.deployed-tag 2>/dev/null || echo none)"
