name: CI

on:
  # Every push, not just main. A branch with no pull request open yet is exactly
  # where a broken change is cheapest to find.
  #
  # main is excluded here only because Release calls this same workflow before
  # it builds anything, so a push to main still runs the whole suite — once,
  # rather than twice in parallel with itself.
  push:
    branches-ignore: [main]
  pull_request:
  # Called by Release, so that publishing and deploying are gated on the same
  # checks a pull request had to pass.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The integration tests drive the API over HTTP against a real PostgreSQL,
    # which is the Platform's one test seam. A stub here would prove the routes
    # are mounted and nothing about whether they can reach a database.
    services:
      # Pinned to the major version we deploy to — Supabase Cloud runs
      # PostgreSQL 17 — rather than a matrix spanning 16 and 17. Nothing we
      # ship runs on 16, so 16 coverage buys nothing, and a matrix trains
      # people to shrug at one red leg. (This image is 17.11, stock Postgres;
      # Supabase Cloud is currently on 17.6 and its own build. Matching the
      # major version closes the search_path-under-maintenance-operations gap
      # that bit the baseline migration; it does not make this a Supabase
      # simulator.)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lean_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      # Includes the Module boundary rule from ADR-0006. It is a convention, so
      # something has to enforce it; leaving it to review is how it decays.
      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Tests
        working-directory: backend
        run: npm test

      # The service container's own health check runs inside the container,
      # where Postgres answers on a unix socket during initialisation before it
      # is listening on TCP. Waiting on the port the tests actually connect to
      # closes that race rather than trusting a readiness signal from the wrong
      # side of it.
      - name: Wait for Postgres to accept TCP connections
        run: |
          for _ in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && exit 0
            sleep 1
          done
          echo "::error::Postgres never accepted a TCP connection"
          exit 1

      # Applies the baseline (and everything after it) to the empty database
      # the service container just created. This is also the acceptance test
      # for "the baseline applies cleanly to an empty database" — there is no
      # separate check for that claim, this step failing IS that check
      # failing. It has to run before the integration tests below, which drive
      # the API over HTTP and need the schema those requests assume to exist.
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lean_platform_test
        run: npm run migrate

      # sqdcp_maintenance() runs nightly in production via pg_cron (see
      # migrations/1756000000001_schedule-maintenance.js), but until now no
      # test or CI step had ever called it directly. It calls
      # refresh_sqdcp_rollups() and then ensure_time_partitions() for both
      # partitioned tables, so calling it here covers strictly more than the
      # rollup-only smoke test this step used to run, in one statement. On
      # PostgreSQL 17, refresh_sqdcp_rollups()'s REFRESH MATERIALIZED VIEW —
      # like any maintenance operation — runs with search_path forced to
      # pg_catalog, pg_temp, which is a different failure mode than the
      # migration succeeding: a schema-qualification bug in a function this
      # calls can pass "Run migrations" and still fail every night. On an
      # empty database this costs milliseconds, and it will keep catching
      # this bug class for every matview or partitioned table added after
      # this one, long after the migration that created it went green.
      #
      # This does not exercise the pg_cron schedule itself — postgres:17-alpine
      # has no pg_cron, so the migration above takes its "unavailable, skip"
      # path here rather than actually scheduling anything. It exercises the
      # function pg_cron calls nightly, which is what a schema-qualification
      # or partition-window bug would actually break.
      - name: Maintenance smoke test (partitions + rollup refresh)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lean_platform_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT sqdcp_maintenance()'

      - name: Integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lean_platform_test
        run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This version must match the base image in frontend/Dockerfile. If the
      # two drift, CI passes against a toolchain that never builds the image.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Tests
        working-directory: frontend
        run: flutter test

      - name: Build web
        working-directory: frontend
        run: flutter build web --release --no-web-resources-cdn

      # The app must serve from one origin. A build that fetches CanvasKit from
      # a Google CDN renders as empty boxes on a deployment with no egress — a
      # deploy-time surprise that no other check would catch.
      #
      # The checks are specific on purpose: a blanket grep for "gstatic.com"
      # fails on a correct build, because the loader carries the CDN URL as a
      # dead branch that `useLocalCanvasKit: true` never takes, and the engine's
      # own fontFallbackBaseUrl (used for glyphs outside the bundled Roboto
      # family) still carries `fonts.gstatic.com/s/` as a literal string in a
      # correct build. Checking for the bundled font's presence, rather than
      # for the CDN string's absence, is what a correct build can actually pass.
      - name: Web build is self-contained
        working-directory: frontend
        run: |
          if grep -rlq 'gstatic\.com/flutter-canvaskit' build/web/main.dart.js; then
            echo "::error::the build references the CanvasKit CDN"
            exit 1
          fi
          test -f build/web/canvaskit/canvaskit.wasm
          echo "CanvasKit is served from the app's own origin"
          test -f build/web/assets/assets/fonts/Roboto-Regular.ttf
          grep -q '"family":"Roboto"' build/web/assets/FontManifest.json
          echo "Roboto is served from the app's own origin"

  # Builds both images without publishing them, so a Dockerfile that no longer
  # builds fails on the pull request rather than on the push to main that was
  # meant to deploy it.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          # Scoped per image. Unscoped, the two matrix legs write the same GitHub
          # Actions cache and overwrite each other's layers every run.
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}
