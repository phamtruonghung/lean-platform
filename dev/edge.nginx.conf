# ==============================================================================
# Local development edge router.
#
# In production a reverse proxy on the LXC terminates TLS and splits traffic by
# path:
#     /api/... -> backend
#     /...     -> frontend
#
# This tiny nginx does the same thing for `docker compose`, so local and
# production behave identically, the frontend image stays free of any knowledge
# about where the backend lives, and the browser sees one origin in both — which
# is what means there is no CORS anywhere in this repository.
#
# The block below the banner — which address this edge vouches for — is the one
# part of this file that production depends on as well: the `platform-edge`
# container on CT102 runs this file, so a change here is a change there (copy it
# and `nginx -s reload`).
# ==============================================================================

# ------------------------------------------------------------------------------
# Which address this edge vouches for.
#
# The API is reachable two ways. Through Cloudflare: cloudflared on the host
# (its ingress points at http://localhost:80) passes the caller's
# `CF-Connecting-IP`, which Cloudflare's edge wrote and overwrote. And directly:
# port 80 is published on the plant LAN, so a caller there reaches this server
# without Cloudflare and can write any header it likes — including
# `CF-Connecting-IP`. Believed as-is, that let a caller name its own sign-in
# bucket and spray passwords for free.
#
# So the peer is classified once, here, and the answer is written into ONE header
# that this edge OVERWRITES (`proxy_set_header` replaces, never appends). A peer
# that is the tunnel connector is tunnel traffic: loopback, because cloudflared
# runs on the host, and the Docker bridge space, because a connector may run as a
# container. Anything else is a direct caller and is counted as its own address.
#
# Measured on CT102 while writing this: the published port sends every caller
# through Docker's proxy, so tunnel and LAN traffic both arrive as 172.18.0.1 and
# the classification cannot separate them there. That is a deployment fact, not a
# hole in the API: the backend also resolves the caller from the request's own
# hop chain and only believes this header when the two agree, so a caller's
# written header buys nothing either way. Binding the edge's published port to
# 127.0.0.1 (so only cloudflared on the host can reach it) is what would make
# this half exact, and it is a deploy decision, not a code one.
# ------------------------------------------------------------------------------
geo $edge_peer_is_tunnel {
  default 0;
  127.0.0.0/8 1;
  172.16.0.0/12 1;
}

map $edge_peer_is_tunnel $edge_claimed_addr {
  1 $http_cf_connecting_ip;
  default $remote_addr;
}

# Tunnel traffic with no Cloudflare address at all did not come through
# Cloudflare: count it as the connector rather than as an empty string. (`"~."`
# matches any non-empty value; a `map` cannot spell an empty key.)
map $edge_claimed_addr $edge_client_addr {
  "~." $edge_claimed_addr;
  default $remote_addr;
}

server {
  listen 80;
  server_name localhost;

  # Docker's embedded DNS server. A resolver plus a variable upstream means
  # nginx starts even when a service is not up yet, instead of exiting with
  # "host not found in upstream".
  resolver 127.0.0.11 valid=10s;

  # A regex location, not the prefix `/api/`, so that bare `/api` reaches the
  # backend too. With the prefix form nginx redirects `/api` into the Flutter
  # app, and a caller who dropped the trailing slash gets HTML where they asked
  # for JSON.
  location ~ ^/api(/|$) {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The caller as this edge counted it — the sign-in throttle's key, and the
    # only header the API reads for one. Set here, so a caller's own value is
    # gone before the request leaves this server.
    proxy_set_header X-Real-IP $edge_client_addr;
    proxy_set_header X-Client-IP $edge_client_addr;
    # Replaced, not appended: X-Forwarded-For is a list a caller can prepend to,
    # and nothing behind this edge may read an entry a caller chose.
    proxy_set_header X-Forwarded-For $edge_client_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream http://frontend:8080;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
