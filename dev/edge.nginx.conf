# ==============================================================================
# Local development edge router.
#
# In production a reverse proxy on the LXC terminates TLS and splits traffic by
# path:
#     /api/... -> backend
#     /...     -> frontend
#
# This tiny nginx does the same thing for `docker compose`, so local and
# production behave identically, the frontend image stays free of any knowledge
# about where the backend lives, and the browser sees one origin in both — which
# is what means there is no CORS anywhere in this repository.
#
# This file is for local development only. It is never deployed.
# ==============================================================================

server {
  listen 80;
  server_name localhost;

  # Docker's embedded DNS server. A resolver plus a variable upstream means
  # nginx starts even when a service is not up yet, instead of exiting with
  # "host not found in upstream".
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream http://frontend:8080;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
