# ==============================================================================
# Static file server for the Flutter web build.
#
# There is deliberately no /api proxy here. The edge in front of this container
# routes /api straight to the backend, so the browser sees one origin and the
# relative URLs in the app work unchanged.
# ==============================================================================

# A Flutter web build contains no content-hashed filenames: index.html loads
# flutter_bootstrap.js, which loads main.dart.js, and every one of those keeps
# its name from build to build. There is no filename here safe to freeze, so the
# files carrying application code are never stored and everything else
# revalidates cheaply against its ETag.
map $uri $cache_control {
    default                 "no-cache";
    ~*\.html$               "no-store, must-revalidate";
    /flutter_bootstrap.js   "no-store, must-revalidate";
    /main.dart.js           "no-store, must-revalidate";
    /manifest.json          "no-store, must-revalidate";
}

server {
  # 8080, not 80: the server runs as a non-root user, and only root may bind to
  # ports below 1024.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # nginx's add_header does NOT merge across levels: a location that sets any
  # add_header of its own silently drops every header inherited from here,
  # Cache-Control included. That is why every header is declared once, at server
  # level, and why no location below adds one.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control always;

  # Without this, probes fetch the whole application shell every few seconds.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Unknown paths fall back to index.html so the app's own routing, not nginx,
  # decides what a deep link means.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm;
}
