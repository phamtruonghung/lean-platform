# ==============================================================================
# Static file server for the Flutter web build.
#
# There is deliberately no /api proxy here. The edge in front of this container
# routes /api straight to the backend, so the browser sees one origin and the
# relative URLs in the app work unchanged.
# ==============================================================================

# A Flutter web build contains no content-hashed filenames: index.html loads
# flutter_bootstrap.js, which loads main.dart.js, and every one of those keeps
# its name from build to build. There is no filename here safe to freeze, so the
# files carrying application code are never stored and everything else
# revalidates cheaply against its ETag.
map $uri $cache_control {
    default                 "no-cache";
    ~*\.html$               "no-store, must-revalidate";
    /flutter_bootstrap.js   "no-store, must-revalidate";
    /main.dart.js           "no-store, must-revalidate";
    /manifest.json          "no-store, must-revalidate";
}

server {
  # 8080, not 80: the server runs as a non-root user, and only root may bind to
  # ports below 1024.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # nginx's add_header does NOT merge across levels: a location that sets any
  # add_header of its own silently drops every header inherited from here,
  # Cache-Control included. That is why every header is declared once, at server
  # level, and why no location below adds one.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cache-Control $cache_control always;

  # HSTS: this origin is only ever served over TLS by the edge in front of it
  # (deploy/Caddyfile terminates it; this container speaks plain HTTP behind
  # it), so a browser that learns HTTPS here never has to be told twice. The
  # max-age is 180 days — long enough to be worth having, short enough that
  # undoing a TLS mistake does not require waiting a year — and
  # `includeSubDomains` is safe because the deployment's hostname has no
  # siblings under it. No `preload`: that is a submission to a browser vendor's
  # list, which is a deploy decision, not a header this file can make.
  #
  # `always`, like every header above: a 404 or a 500 must carry it too,
  # because the first response a browser sees for a host is what it remembers.
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  # CSP: the Flutter web bundle is a single-origin application. Nothing is
  # fetched from anywhere else — CanvasKit and the fonts are built into the
  # image (`flutter build web --no-web-resources-cdn`, see Dockerfile), and the
  # API is reached on this same origin, which is why there is no CORS anywhere
  # in this repository (ADR-0002). Every allowance below is named for the thing
  # that needs it, and nothing is here "just in case":
  #
  #   script-src 'self' 'wasm-unsafe-eval'
  #       'self' for main.dart.js, flutter_bootstrap.js, flutter.js and the
  #       CanvasKit loader. The bootstrap listener for `flutter-first-frame`
  #       used to be an inline <script> in index.html; it lives in
  #       web/boot_splash.js now precisely so that no 'unsafe-inline' is needed
  #       here. That is the directive worth keeping strong: the session token is
  #       in a script-readable key-value store (lib/platform/local_auth_gateway
  #       .dart), so injected script is the attack this policy exists to stop.
  #       'wasm-unsafe-eval' (not 'unsafe-eval') is what Chrome requires before
  #       it will compile canvaskit.wasm; it permits WebAssembly compilation and
  #       nothing else.
  #   style-src 'unsafe-inline'
  #       The Flutter engine writes element styles and a <style> element at
  #       runtime, and index.html's boot surface is a <style> block that must
  #       paint before any other request is made (issue #400). Styles cannot read
  #       the session, so this is the cheap half of the policy.
  #   img-src 'self' data:
  #       The icons and the boot surface's SVG come from this origin; `data:` is
  #       there for the engine's own inline bitmaps.
  #   connect-src 'self'
  #       Every fetch and XHR goes to /api on this origin. The list is closed on
  #       purpose: an injected script cannot exfiltrate to a host it names.
  #   frame-ancestors 'self' / base-uri 'self' / object-src 'none' /
  #   form-action 'self'
  #       The same guarantees X-Frame-Options gives, restated where a modern
  #       browser reads them first; no <base> rewrite; no plugins; forms only to
  #       this origin.
  #
  # Relax this only after a violation is measured, and name the directive and
  # the request that needed it in the commit that does. frontend/nginx.conf is
  # the only place a browser-facing response gets one: every `location` below
  # inherits this block, and the API's own JSON gets its counterpart in
  # backend/src/platform/security-headers.js — /api never passes through this
  # container.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

  # Without this, probes fetch the whole application shell every few seconds.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Unknown paths fall back to index.html so the app's own routing, not nginx,
  # decides what a deep link means.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/wasm;
}
