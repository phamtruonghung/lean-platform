name: lean_platform
description: "Platform — Flutter Web client for the Platform API."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^9.1.1
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.0.0
  http: ^1.2.2
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Roboto is bundled rather than left to the engine, which would otherwise
  # fetch it from fonts.gstatic.com on first paint. See assets/fonts/README.md.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
